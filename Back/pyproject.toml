[project]
name = "knowledge-base-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<2.1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "pydantic-settings>=2.7,<3",
  "pyjwt>=2.10,<3",
  "pwdlib[argon2]>=0.2,<1",
  "python-multipart>=0.0.20,<1",
  "httpx>=0.28,<1",
  "redis>=5.2,<7",
  "minio>=7.2,<8",
  "pymilvus>=2.5,<2.6",
  "python-docx>=1.1,<2",
  "cryptography>=44,<48",
  "numpy>=1.26,<3",
  "langgraph>=1,<2",
  "openai>=2,<3",
  "pillow>=12,<13",
]

[project.optional-dependencies]
embedding = ["torch>=2.6,<3", "transformers>=4.48,<5", "sentencepiece>=0.2,<1"]
dev = ["pytest>=8.3,<10", "ruff>=0.9,<1", "pytest-cov>=6,<8"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
